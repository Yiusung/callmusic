workflows:
  ios-workflow:
    name: iOS Build with Free Apple ID
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.yc.callmusicplayer"
        APP_NAME: "CallMusicPlayer"
        XCODE_PROJECT: "CallMusicPlayer.xcodeproj"
        XCODE_SCHEME: "CallMusicPlayer"

    scripts:
      - name: Set build number
        script: |
          agvtool new-version -all $(($(app-store-connect get-latest-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1)) || true

      - name: Build archive
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            archive \
            -archivePath "$CM_BUILD_DIR/$APP_NAME.xcarchive" \
            | xcpretty --utf --color && exit ${PIPESTATUS[0]}

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/$APP_NAME.xcarchive" \
            -exportOptionsPlist "ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -allowProvisioningUpdates \
            | xcpretty --utf --color && exit ${PIPESTATUS[0]}

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - yaochongye@gmail.com
        notify:
          success: true
          failure: true
